<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Be My Valentine 💌</title>

<!-- Retro Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pacifico&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(180deg, #ffd6e8, #e6d9ff);
  font-family: 'Press Start 2P', cursive;
}

/* ===== PIXEL BACKGROUND ===== */
.bg-item {
  position: absolute;
  opacity: 0.8;
  animation: float 6s ease-in-out infinite;
}

.star {
  width: 10px;
  height: 10px;
  background: gold;
  transform: rotate(45deg);
}

.cloud {
  width: 80px;
  height: 40px;
  background: #fff;
  border-radius: 50px;
}

.strawberry {
  width: 14px;
  height: 14px;
  background: #ff4d6d;
  border-radius: 50%;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

/* ===== MAIN SCENE ===== */
.scene {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 2;
  position: relative;
}

h1 {
  font-family: 'Pacifico', cursive;
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: #ff5fa2;
  text-shadow: 0 4px 0 #fff;
  animation: pop 1s ease;
}

@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* ===== BUTTONS ===== */
.buttons {
  margin-top: 40px;
  position: relative;
}

button {
  padding: 14px 24px;
  font-size: 0.9rem;
  border-radius: 14px;
  border: 3px solid #ff5fa2;
  background: white;
  color: #ff5fa2;
  box-shadow: 0 6px 0 #ffb3d9;
  margin: 0 20px;
  transition: 0.15s;
}

button:hover {
  transform: scale(1.1);
}

#noBtn {
  position: absolute;
}

.shake {
  animation: shake 0.2s infinite;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  50% { transform: translateX(4px); }
  75% { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}

/* ===== SUCCESS SCREEN ===== */
#success {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255, 214, 232, 0.95);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 10;
}

#success img {
  width: 260px;
}

/* ===== CONFETTI ===== */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<!-- Background Elements -->
<script>
for(let i=0;i<30;i++){
  const el = document.createElement('div');
  el.className = `bg-item ${['star','cloud','strawberry'][Math.floor(Math.random()*3)]}`;
  el.style.left = Math.random()*100+'vw';
  el.style.top = Math.random()*100+'vh';
  el.style.animationDuration = 4+Math.random()*6+'s';
  document.body.appendChild(el);
}
</script>

<div class="scene">
  <h1>Will you be my Valentine? 💘</h1>

  <div class="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😼</button>
  </div>
</div>

<!-- SUCCESS -->
<div id="success">
  <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Love">
  <h2 style="color:#ff5fa2;font-family:Pacifico;margin-top:20px;">
    YAYYYYY 💕
  </h2>
</div>

<!-- Sounds -->
<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-retro-game-notification-212.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-video-game-win-2016.mp3"></audio>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const success = document.getElementById('success');
const clickSound = document.getElementById('clickSound');
const winSound = document.getElementById('winSound');

let noCount = 0;
const taunts = [
  "missed me 😼",
  "hehe nope",
  "nice try",
  "not today",
  "almost 💀"
];

document.addEventListener('mousemove', (e) => {
  const rect = noBtn.getBoundingClientRect();
  const dist = Math.hypot(
    e.clientX - (rect.left + rect.width/2),
    e.clientY - (rect.top + rect.height/2)
  );

  if (dist < 100) {
    noCount++;
    noBtn.classList.add('shake');
    noBtn.textContent = taunts[Math.floor(Math.random()*taunts.length)];

    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 120);
    noBtn.style.left = x+'px';
    noBtn.style.top = y+'px';

    // SECRET ENDING
    if(noCount > 12){
      noBtn.textContent = "OK FINE 😭";
      noBtn.style.display = "none";
    }
  } else {
    noBtn.classList.remove('shake');
  }
});

yesBtn.addEventListener('click', () => {
  winSound.play();
  success.style.display = 'flex';
  spawnConfetti();
});

function spawnConfetti(){
  for(let i=0;i<200;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.animationDuration = 2+Math.random()*3+'s';
    c.style.background =
      ['#ff5fa2','#ffd700','#ffffff','#d6b3ff'][Math.floor(Math.random()*4)];
    document.body.appendChild(c);
  }
}
</script>

</body>
</html>
