<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff85a2;
            --dark-pink: #ff4d6d;
            --bg: #fff0f3;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .pixel-heart {
            width: 50px;
            height: 50px;
            background: var(--dark-pink);
            position: relative;
            animation: pulse 1s infinite;
            box-shadow: 10px 10px 0 #ffb3c1;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Main Card */
        #card {
            display: none;
            text-align: center;
            background: white;
            padding: 40px;
            border: 6px solid #000;
            box-shadow: 15px 15px 0 var(--pink);
            max-width: 400px;
            position: relative;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: var(--dark-pink);
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .pixel-decor {
            font-size: 2rem;
            margin: 10px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            height: 50px;
        }

        button {
            padding: 10px 25px;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            cursor: pointer;
            border: 4px solid #000;
            transition: transform 0.1s;
        }

        #yesBtn {
            background: #70e000;
            box-shadow: 4px 4px 0 #38b000;
        }

        #noBtn {
            background: #ff4d6d;
            box-shadow: 4px 4px 0 #c9184a;
            position: absolute;
        }

        /* Celebration State */
        #celebration {
            display: none;
            text-align: center;
        }

        img {
            max-width: 100%;
            border: 5px solid #000;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="pixel-heart"></div>
        <p>Loading Love...</p>
    </div>

    <div id="card">
        <div class="pixel-decor">🌸 ✨ 🎀</div>
        <h1>Will you be my Valentine?</h1>
        <div class="btn-container">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <div id="celebration">
        <h1>YAY! SEE YOU SOON! ❤️</h1>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZ4bm9oZzR6eXN6eHpsbm80eXN6eHpsbm80eXN6eHpsbm8mZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/jS7tkOa9ccf8qfXqW9/giphy.gif" alt="The Office Celebration">
    </div>

    <script>
        // Simulate Loading
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('card').style.display = 'block';
            
            // Set initial position for No button
            const noBtn = document.getElementById('noBtn');
            const container = document.querySelector('.btn-container');
            noBtn.style.left = (container.offsetLeft + 150) + 'px';
            noBtn.style.top = (container.offsetTop) + 'px';
        }, 2000);

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Move No Button on Hover
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // Click Yes
        yesBtn.addEventListener('click', () => {
            document.getElementById('card').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#ffccd5";
        });
    </script>
</body>
</html>
